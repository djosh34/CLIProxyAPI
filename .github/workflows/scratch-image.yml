# The fork's only workflow. On PRs it builds and smoke-tests Dockerfile.scratch.
# On a push to main and on dispatch it builds this checkout, smoke-tests it and
# pushes both platforms to GHCR under a tag that names the commit.
name: scratch-image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scratch-image-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: djosh34/cliproxyapi

jobs:
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.scratch
          platforms: linux/amd64
          load: true
          tags: cliproxyapi:smoke
          build-args: |
            VERSION=pr-${{ github.event.pull_request.number }}
            COMMIT=${{ github.sha }}
      - name: Smoke test
        run: .github/scripts/scratch-smoke-test.sh cliproxyapi:smoke
      - name: Build both platforms
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.scratch
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=pr-${{ github.event.pull_request.number }}
            COMMIT=${{ github.sha }}

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: main-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build date
        id: meta
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.scratch
          platforms: linux/amd64
          load: true
          tags: cliproxyapi:smoke
          build-args: |
            VERSION=${{ env.TAG }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
      - name: Smoke test
        run: .github/scripts/scratch-smoke-test.sh cliproxyapi:smoke
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push both platforms
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.scratch
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            VERSION=${{ env.TAG }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
      - name: Record commit and digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          line="ghcr.io/$IMAGE:$TAG commit $GITHUB_SHA digest $DIGEST"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
